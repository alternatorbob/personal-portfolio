<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PORTFOLIO</title>

    <link rel="stylesheet" href="css/init.css" />
</head>

<body>
    <div class="fade"></div>
    <script>
        const fadeElement = document.querySelector(".fade");

        setTimeout(function () {
            fadeElement.classList.add("fade-out");
        }, 770);

        // Listen for the 'transitionend' event and remove the element once the fade-out animation is complete
        fadeElement.addEventListener("transitionend", function () {
            fadeElement.remove();
        });
    </script>

    <div class="main-container">
        <div class="navbar">
            <div class="navbar-name text-sm">
                <div id="name">Bogdan Năstase</div>
            </div>
            <div class="navbar-right">
                <div class="navbar-button" id="about-button">About</div>
                <div class="view-toggle">
                    <div class="toggle-slider"></div>
                    <div class="toggle-text">
                        <span style="margin-left:-4px">3D</span>
                        <span>LIST</span>
                    </div>
                    <div class="toggle-cover toggle-cover-3d"></div>
                    <div class="toggle-cover toggle-cover-list"></div>
                </div>
                <div class="button button-invert">
                    <img src="/assets/UI/ball-button.png" alt="Invert colors">
                </div>
            </div>
            <div class="navbar-hint text-sm">
                To browse, drag the sphere. To open a project, click an image.
            </div>
        </div>
        <div id="blur" class="hide"></div>

        <!-- List View -->
        <div class="list-view">
            <table class="list-view-table">
                <thead>
                    <tr>
                        <th data-sort="title">Project Title<span class="sort-indicator"></span></th>
                        <th data-sort="category">Category</th>
                        <th data-sort="year" class="sort-active sort-desc">Year<span class="sort-indicator">↓</span>
                        </th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Will be populated with JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <div class="project-card">
        <div class="project-info">
            <div class="project-title-group">
                <div class="project-title"></div>
            </div>
            <div class="project-year"></div>
            <div class="project-description"></div>
        </div>
        <div class="project-gallery">
            <div class="slideshow-container"></div>
        </div>
    </div>

    <div class="about-card">
        <div class="about-info">
            <div class="about-title-group">
                <div class="about-title">About</div>
            </div>
            <div class="about-description"></div>
        </div>
        <div class="about-gallery">
            <div class="slideshow-container"></div>
        </div>
    </div>

    <script type="module" src="/main.js"></script>
    <script type="module" src="js/ui.js"></script>
    <div class="invert"></div>
</body>

</html>
