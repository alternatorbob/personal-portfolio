<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PORTFOLIO</title>

    <link rel="stylesheet" href="css/init.css" />
</head>

<body>
    <div class="fade"></div>
    <script>
        const fadeElement = document.querySelector(".fade");

        setTimeout(function () {
            fadeElement.classList.add("fade-out");
        }, 770);

        // Listen for the 'transitionend' event and remove the element once the fade-out animation is complete
        fadeElement.addEventListener("transitionend", function () {
            fadeElement.remove();
        });
    </script>

    <div class="main-container">
        <div class="navbar">
            <div class="navbar-name text-sm bold">
                <div id="name">Bogdan Năstase</div>
            </div>
            <div class="navbar-center">
                <div class="button button-invert">
                    <img src="/assets/UI/ball-button-metal.png" alt="Metal mode" class="metal-button" />
                    <img src="/assets/UI/ball-button-glass.png" alt="Glass mode" class="glass-button" style="position:absolute"/>
                </div>
            </div>
            <div class="navbar-right text-sm bold">
                <div class="view-toggle button">
                    <span id="index">Index</span>
                </div>
                <div class="navbar-button button" id="about-button">About</div>
            </div>
            <div class="navbar-hint text-sm bold">To browse, drag the sphere or scroll. To open a project, click an image.
            </div>
        </div>
        <div id="blur" class="hide"></div>
    </div>

    <!-- Index View - moved outside main container -->
    <div class="index-view">
        <table class="index-view-table">
            <tbody>
                <!-- Will be populated with JavaScript -->
            </tbody>
        </table>
    </div>

    <script type="module" src="/main.js"></script>
    <script type="module" src="js/ui.js"></script>
    <div class="invert"></div>
</body>

</html>
