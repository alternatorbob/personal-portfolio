<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PORTFOLIO</title>

    <link rel="stylesheet" href="css/init.css" />
</head>

<body>
    <div class="fade"></div>
    <script>
        const fadeElement = document.querySelector(".fade");

        setTimeout(function () {
            fadeElement.classList.add("fade-out");
        }, 770);

        // Listen for the 'transitionend' event and remove the element once the fade-out animation is complete
        fadeElement.addEventListener("transitionend", function () {
            fadeElement.remove();
        });
    </script>

    <div class="main-container">
        <div class="navbar">
            <div class="navbar-name text-sm bold">
                <div id="name">Bogdan Năstase</div>
            </div>
            <div class="navbar-center">
                <div class="button button-invert">
                    <img src="/assets/UI/ball-button.png" alt="Invert colors" />
                </div>
            </div>
            <div class="navbar-right text-sm bold">
                <div class="view-toggle button">
                    <div class="toggle-slider"></div>
                    <div class="toggle-text">
                        <div class="toggle-text-container">
                            <span class="toggle-text-close">Close</span>
                            <span class="toggle-text-index">Index</span>
                        </div>
                    </div>
                    <div class="toggle-cover toggle-cover-index"></div>
                    <div class="toggle-cover toggle-cover-close"></div>
                </div>
                <div class="navbar-button button " id="about-button">About</div>
            </div>
            <div class="navbar-hint text-sm">To browse, drag the sphere or scroll. To open a project, click an image.
            </div>
        </div>
        <div id="blur" class="hide"></div>

        <!-- Index View -->
        <div class="index-view">
            <table class="index-view-table">
                <thead>
                    <tr>
                        <th data-sort="title">Project Title<span class="sort-indicator"></span></th>
                        <th data-sort="category">Category</th>
                        <th data-sort="year" class="sort-active sort-desc">Year<span class="sort-indicator">↓</span>
                        </th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Will be populated with JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <script type="module" src="/main.js"></script>
    <script type="module" src="js/ui.js"></script>
    <div class="invert"></div>
</body>

</html>
