<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />

        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>PORTFOLIO</title>

        <!-- Inline loading screen CSS - loads immediately to prevent FOUC -->
        <style>
            /* Immediate loading screen - inline to prevent FOUC */
            #loading-screen {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background-color: #000000;
                display: flex;
                justify-content: center;
                align-items: center;
                z-index: 1000000;
                opacity: 1;
                transition: opacity 5s ease-out;
            }

            #loading-screen.hide {
                opacity: 0;
                transition: opacity 5s ease-out;
                pointer-events: none;
            }

            /* Hide all content until JavaScript loads and processes */
            body:not(.js-loaded) .main-container,
            body:not(.js-loaded) .navbar,
            body:not(.js-loaded) .three-canvas,
            body:not(.js-loaded) .index-view,
            body:not(.js-loaded) script {
                opacity: 0 !important;
                visibility: hidden !important;
            }

            /* Show content only after JavaScript loads */
            body.js-loaded .main-container,
            body.js-loaded .navbar,
            body.js-loaded .three-canvas {
                opacity: 1;
                visibility: visible;
            }

            /* Ensure invert functionality is never hidden */
            .invert {
                opacity: 0 !important;
                visibility: visible !important;
                transition: opacity 0.3s ease-in-out !important;
            }

            .invert.show {
                opacity: 1 !important;
            }

            /* Animated loader styling */
            .loader {
                width: 20px;
                aspect-ratio: 1;
                border-radius: 50%;
                background: #fff;
                box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.3);
                animation: l1 1s infinite;
            }
            @keyframes l1 {
                100% {box-shadow: 0 0 0 30px rgba(255, 255, 255, 0)}
            }
        </style>

        <link rel="stylesheet" href="css/init.css" />
    </head>

    <body>
        <!-- Blackout Screen -->
        <div id="loading-screen">
            <div class="loader"></div>
        </div>

        <div class="main-container">
            <div class="navbar">
                <div class="navbar-name text-sm font-bold">
                    <div id="name">Bogdan Năstase</div>
                </div>
                <div class="navbar-center">
                    <div class="button button-invert">
                        <img src="/assets/UI/ball-button.png" alt="Invert colors" />
                    </div>
                </div>
                <div class="navbar-right">
                    <div class="navbar-button button text-sm font-bold" id="about-button">About</div>
                    <div class="view-toggle text-sm font-bold">Index</div>
                </div>
            </div>
            <div id="blur" class="hide"></div>

            <!-- Index View -->
            <div class="index-view">
                <div class="index-view-grid">
                    <!-- Will be populated with JavaScript -->
                </div>
                <div class="index-view-preview">
                    <img src="" alt="Project Preview" />
                </div>
            </div>
        </div>

        <script type="module" src="/main.js"></script>
        <script type="module" src="js/ui.js"></script>
        <div class="invert"></div>
    </body>
</html>
