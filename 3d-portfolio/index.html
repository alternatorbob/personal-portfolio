<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Bogdan Năstase Portfolio</title>
        <meta name="description" content="Portfolio of Amsterdam based interaction designer Bogdan Năstase" />
        <meta property="og:title" content="Bogdan Năstase" />
        <meta property="og:description" content="Portfolio of Amsterdam based interaction designer Bogdan Năstase" />
        <meta property="og:url" content="https://bogdan-nastase.com" />
        <meta property="og:type" content="website" />

        <!-- Inline loading screen CSS - loads immediately to prevent FOUC -->
        <style>
            /* Immediate loading screen - inline to prevent FOUC */
            #loading-screen {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background-color: #000000;
                display: flex;
                justify-content: center;
                align-items: center;
                z-index: 1000000;
                opacity: 1;
                transition: opacity 5s ease-out;
            }

            #loading-screen.hide {
                opacity: 0;
                transition: opacity 5s ease-out;
                pointer-events: none;
            }

            /* Hide all content until JavaScript loads and processes */
            body:not(.js-loaded) .main-container,
            body:not(.js-loaded) .navbar,
            body:not(.js-loaded) .three-canvas,
            body:not(.js-loaded) .index-view,
            body:not(.js-loaded) script {
                opacity: 0 !important;
                visibility: hidden !important;
            }

            /* Show content only after JavaScript loads */
            body.js-loaded .main-container,
            body.js-loaded .navbar,
            body.js-loaded .three-canvas {
                opacity: 1;
                visibility: visible;
            }

            /* Ensure invert functionality is never hidden */
            .invert {
                opacity: 0 !important;
                visibility: visible !important;
                transition: opacity 0.3s ease-in-out !important;
            }

            .invert.show {
                opacity: 1 !important;
            }

            /* Animated loader styling */
            .loader {
                width: 20px;
                height: 20px;
                border: 3px solid #fff;
                background-color: #fff;
                border-radius: 50%;
                display: inline-block;
                position: relative;
                box-sizing: border-box;
                animation: rotation 1s linear infinite;
            }
            .loader::after {
                content: "";
                box-sizing: border-box;
                position: absolute;
                left: 50%;
                top: 50%;
                transform: translate(-50%, -50%);
                width: 30px;
                height: 30px;
                border-radius: 50%;
                border: 3px solid transparent;
                border-bottom-color: #ffffff;
            }

            @keyframes rotation {
                0% {
                    transform: rotate(0deg);
                }
                100% {
                    transform: rotate(360deg);
                }
            }
        </style>

        <link rel="stylesheet" href="css/global_styles.css" />
        <link rel="stylesheet" href="css/style.css" />
        <link rel="stylesheet" href="css/card-styles.css" />
        <link rel="stylesheet" href="css/mobile.css" />
    </head>

    <body>
        <!-- Blackout Screen -->
        <div id="loading-screen">
            <span class="loader"></span>
        </div>

        <div class="main-container">
            <div class="navbar">
                <div class="navbar-name text-sm font-bold">
                    <div id="name">Bogdan Năstase</div>
                </div>
                <div class="navbar-center">
                    <div class="button button-invert">
                        <div class="button bottom-button"></div>
                    </div>
                </div>
                <div class="navbar-right">
                    <div class="navbar-button button text-sm font-bold" id="about-button">About</div>
                    <div class="view-toggle text-sm font-bold" id="index-button">Index</div>
                </div>
            </div>

            <div class="index-view">
                <div class="index-view-grid"></div>
                <div class="index-view-preview">
                    <img src="" alt="Project Preview" />
                </div>
            </div>

            <div id="blur" class="hide"></div>

            <div class="navbar navbar-bottom">
                <div class="navbar-center-bottom">
                    <div class="button-material-toggle">
                        <div class="button bottom-button"></div>
                    </div>
                </div>
            </div>
        </div>

        <script type="module" src="/main.js"></script>
        <script type="module" src="js/ui.js"></script>
        <div class="invert"></div>
    </body>
</html>
